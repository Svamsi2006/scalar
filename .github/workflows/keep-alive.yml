name: Streamlit Keep-Alive
on:
  schedule:
    - cron: "*/10 * * * *" # Runs every 10 minutes
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://scalarproject.streamlit.app' }}
    steps:
      - name: Ping Streamlit App
        run: curl --silent --show-error --head --max-time 30 "$STREAMLIT_APP_URL" > /dev/null
